# TornadoVM options, read after the -D options of the command line, which win.
# Every option, with its default, is listed by `tornado --list-flags` and in docs/source/flags.rst.
#
# Index of the default backend and of the default device within it, as numbered by `tornado --devices`.
tornado.backend = 0
tornado.device = 0
#
# OpenCL work-group size of one-dimensional kernels on GPUs, for every task (default 256).
tornado.opencl.gpu.block.x = 512
