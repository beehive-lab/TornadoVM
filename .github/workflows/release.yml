name: 0 - Release Orchestrator [manual]

# Single entry point that dispatches 1-prepare-release.yml. Once the release
# PR it creates is reviewed and merged, the rest of the chain (finalize →
# build SDKs for jdk21+jdk25+jdk26+jdk27 → deploy → publish) runs
# automatically.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 4.0.1).'
        required: true
        type: string
      previous_version:
        description: 'Previous version for the changelog (e.g. 4.0.0).'
        required: true
        type: string
      draft_release_test:
        description: 'Draft release (test): run the whole pipeline end-to-end (builds the SDKs for real) without opening a PR, creating a tag/GitHub Release, or publishing to Maven Central/SDKMAN.'
        required: false
        type: boolean
        default: false

jobs:
  fan-out:
    if: github.repository == 'beehive-lab/TornadoVM'
    runs-on: [self-hosted, Linux, x64]
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z without any suffix (got '${{ inputs.version }}')."
            exit 1
          fi
          if [[ ! "${{ inputs.previous_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::previous_version must be X.Y.Z without any suffix (got '${{ inputs.previous_version }}')."
            exit 1
          fi

      - name: Dispatch 1-prepare-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 1-prepare-release.yml \
            --repo "${{ github.repository }}" \
            -f version="${{ inputs.version }}" \
            -f previous_version="${{ inputs.previous_version }}" \
            -f draft_release_test="${{ inputs.draft_release_test }}"
          echo "Dispatched 1-prepare-release.yml (version=${{ inputs.version }})."

      - name: Summary
        run: |
          {
            if [ "${{ inputs.draft_release_test }}" = "true" ]; then
              echo "## 🧪 Release ${{ inputs.version }} dispatched (DRAFT RELEASE — TEST)"
            else
              echo "## Release ${{ inputs.version }} dispatched"
            fi
            echo ""
            echo "| Workflow | Version |"
            echo "|----------|---------|"
            echo "| [1-prepare-release](https://github.com/${{ github.repository }}/actions/workflows/1-prepare-release.yml) | ${{ inputs.version }} |"
            echo ""
            if [ "${{ inputs.draft_release_test }}" = "true" ]; then
              echo "Prepare workflow now running in test mode: no PR, no tag, no GitHub Release,"
              echo "no Maven Central/SDKMAN pushes. It will dispatch finalize (test) automatically, which"
              echo "dispatches build-release-sdks (test) automatically — the SDKs still get built for real"
              echo "(all of jdk21/25/26/27), nothing gets uploaded or published."
            else
              echo "Prepare workflow now running. It will open a PR for review."
              echo "Merging the PR continues the chain automatically (finalize → build → deploy → publish)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
