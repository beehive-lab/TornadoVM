name: "GPU CI (one platform)"

# Reusable half of gpu-ci.yml, invoked once per platform so that each platform's tests start
# as soon as ITS OWN builds finish. `needs:` is a job-level dependency in GitHub Actions -- it
# cannot reference a single leg of a matrix -- so a single test job depending on a single build job
# made every leg wait for the slowest build anywhere, including the other machine's. In the run of
# 2026-08-11 the Linux builds were done at 14:56:25 but the first test only started at 15:02:11,
# behind a macOS build: six idle minutes out of forty, on machines that share nothing.
#
# Splitting per platform rather than per backend is deliberate: the backends of one platform share
# a single GPU and one runner process, so they serialise regardless. It is only the cross-machine
# wait that is pure loss.

on:
  workflow_call:
    inputs:
      platform:
        description: "linux or macos (used only for job naming)"
        required: true
        type: string
      build_matrix:
        description: "JSON matrix object for this platform's build jobs"
        required: true
        type: string
      test_matrix:
        description: "JSON matrix object for this platform's test jobs"
        required: true
        type: string
      test_scope:
        description: >-
          fast: the quick-pass suite on the default device (pull requests).
          full: the whole suite on every device the backend reports (nightly).
        required: false
        default: fast
        type: string
      ref:
        description: >-
          What to check out. Empty takes actions/checkout's default for the triggering event;
          the nightly run passes develop, since a schedule always fires on the default branch.
        required: false
        default: ""
        type: string

env:
  # Build JDK for the jdk25plus SDK. Any JDK >= 25 produces an identical artifact (the vendored
  # module descriptors are pinned to the floor), so this is pinned purely for reproducibility.
  JDK25PLUS_BUILD_JAVA_HOME_LINUX: /opt/jenkins/jdks/jdk-25.0.2
  JDK25PLUS_BUILD_JAVA_HOME_MACOS: /opt/jenkins/jdks/jdk-25.0.2.jdk/Contents/Home

jobs:
  build:
    # Explicit name. The default splices in every matrix value including the runner labels
    # (self-hosted, Linux, x64), which repeats the platform the caller's prefix already gives and
    # surfaces scheduling detail that belongs in runs-on. Naming the two things that actually
    # distinguish a job -- which SDK, and for a test which JDK it runs on -- means the run can be
    # read without opening this file.
    name: build-${{ matrix.sdk }}-${{ matrix.backend }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TORNADO_ROOT: ${{ github.workspace }}
      TORNADOVM_HOME: ${{ github.workspace }}/bin/sdk
      VENV_PATH: ${{ github.workspace }}/venv-${{ matrix.backend }}-${{ matrix.sdk }}
      JAVAFX_SDK: /opt/jenkins/javafx-sdk-21.0.11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve build environment
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            echo "CMAKE_ROOT=/opt/jenkins/cmake-3.25.2-linux-x86_64" >> "$GITHUB_ENV"
            echo "MAVEN_HOME=/opt/maven" >> "$GITHUB_ENV"
            echo "JAVA_HOME=$JDK25PLUS_BUILD_JAVA_HOME_LINUX" >> "$GITHUB_ENV"
          else
            echo "CMAKE_ROOT=/opt/homebrew/bin/cmake" >> "$GITHUB_ENV"
            echo "MAVEN_HOME=/opt/homebrew/bin/mvn" >> "$GITHUB_ENV"
            echo "JAVA_HOME=$JDK25PLUS_BUILD_JAVA_HOME_MACOS" >> "$GITHUB_ENV"
          fi

      - name: Setup environment
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "$MAVEN_HOME/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Setup Python venv
        run: |
          python3 -m venv $VENV_PATH
          source $VENV_PATH/bin/activate
          pip install --upgrade pip tqdm psutil

      - name: Build TornadoVM (${{ matrix.sdk }}, ${{ matrix.backend }})
        run: |
          source $VENV_PATH/bin/activate
          make ${{ matrix.sdk }} BACKEND=${{ matrix.backend }}

      - name: Stage the SDK for the test jobs
        run: |
          SDK=$(ls -d dist/*/*/ | head -1)
          echo "Staging $SDK"
          cat "$SDK/etc/tornado.jdk"
          # setvars.sh is NOT shipped: it pins JAVA_HOME to the build JDK, which would silently
          # make every test leg run on that JDK instead of its own. Test jobs set TORNADOVM_HOME.
          tar -czf sdk.tgz -C "$(dirname "${SDK%/}")" "$(basename "${SDK%/}")"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}-${{ matrix.backend }}-${{ matrix.sdk }}
          path: sdk.tgz
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # TEST: the SAME artifact, run on each JDK. These need the GPU, so they are serialised per
  # machine with a concurrency group rather than by chaining `needs`.
  # ---------------------------------------------------------------------------------------
  test:
    name: test-${{ matrix.sdk }}-on-${{ matrix.jdk }}-${{ matrix.backend }}
    needs: build
    # The full suite runs once per device, so a nightly leg is several times a pull request's.
    timeout-minutes: ${{ inputs.test_scope == 'full' && 240 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Deliberately NO `concurrency:` group here. These legs share one GPU per machine and must
    # not overlap, but a concurrency group is not a queue: GitHub keeps a single pending job per
    # group and cancels any other, which would silently drop most of this matrix. Serialisation
    # comes from the runner instead -- one runner process per machine means one job at a time.
    # If a machine is ever given several runner processes, serialise with a distinct label.
    env:
      VENV_PATH: ${{ github.workspace }}/venv-test-${{ matrix.backend }}-${{ matrix.jdk }}
      JAVAFX_SDK: /opt/jenkins/javafx-sdk-21.0.11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve runtime JDK (${{ matrix.jdk }})
        run: |
          # Discovered rather than hardcoded: this job only needs a JDK to RUN on, nothing is
          # compiled against it, and the exact patch level is irrelevant. Searching and then
          # verifying with `java -version` means a JDK upgrade (26.0.1 -> 26.0.2) needs no
          # workflow edit, and a loose glob cannot silently select the wrong feature release.
          FEATURE="${{ matrix.jdk }}"; FEATURE="${FEATURE#jdk}"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            echo "MAVEN_HOME=/opt/maven" >> "$GITHUB_ENV"
          else
            echo "MAVEN_HOME=/opt/homebrew/bin/mvn" >> "$GITHUB_ENV"
          fi
          ROOT=/opt/jenkins/jdks
          CANDIDATES="$(ls -d $ROOT/*$FEATURE*/Contents/Home $ROOT/*/*$FEATURE*/Contents/Home \
                              $ROOT/*$FEATURE* $ROOT/*/*$FEATURE* 2>/dev/null || true)"
          FOUND=""
          for c in $CANDIDATES; do
            c="${c%/}"
            [ -x "$c/bin/java" ] || continue
            V="$("$c/bin/java" -version 2>&1 | head -1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p')"
            if [ "$V" = "$FEATURE" ]; then FOUND="$c"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no JDK $FEATURE found under $ROOT"
            echo "searched:"; echo "$CANDIDATES" | sed 's/^/  /'
            exit 1
          fi
          echo "Resolved JDK $FEATURE -> $FOUND"
          echo "JAVA_HOME=$FOUND" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}-${{ matrix.backend }}-${{ matrix.sdk }}

      - name: Unpack the SDK and point the environment at it
        run: |
          mkdir -p sdk && tar -xzf sdk.tgz -C sdk
          SDK="$(ls -d $PWD/sdk/*/)"
          echo "TORNADOVM_HOME=${SDK%/}" >> "$GITHUB_ENV"
          echo "${SDK%/}/bin" >> "$GITHUB_PATH"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "$MAVEN_HOME/bin" >> "$GITHUB_PATH"
          # NOTE: deliberately no `source setvars.sh` anywhere in this job. That file hardcodes
          # the BUILD JDK into JAVA_HOME, so sourcing it would make every leg of this matrix run
          # on the same JDK and quietly test nothing.
          echo "--- SDK contract:"; cat "${SDK%/}/etc/tornado.jdk"

      - name: Setup Python venv
        run: |
          python3 -m venv $VENV_PATH
          source $VENV_PATH/bin/activate
          pip install --upgrade pip tqdm psutil

      - name: Show the JDK actually under test
        run: |
          java -version
          tornado --devices

      - name: Run ${{ matrix.backend }} ${{ inputs.test_scope }} unit tests
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          source $VENV_PATH/bin/activate
          if [ "$TEST_SCOPE" != "full" ]; then
            make fast-tests
            exit 0
          fi
          # `make tests`, but once per device rather than on the default device only. Each SDK is
          # built for a single backend, so `tornado --devices` lists exactly this backend's
          # devices (e.g. the discrete and the integrated GPU under OpenCL). Every device runs
          # even if an earlier one fails, so one bad driver does not hide the others' results.
          rm -f tornado_unittests.log
          DEVICES="$(tornado --devices | sed -n 's/.*Tornado device=\([0-9]*:[0-9]*\).*/\1/p')"
          if [ -z "$DEVICES" ]; then
            echo "::error::tornado --devices reported no devices"
            exit 1
          fi
          echo "Devices under test: $(echo $DEVICES)"
          rc=0
          for d in $DEVICES; do
            echo "::group::Full unit tests on device $d"
            tornado-test --verbose --jvm="-Dtornado.unittests.device=$d" \
              || { echo "::error::unit tests failed on device $d"; rc=1; }
            echo "::endgroup::"
          done
          tornado-test -V -J"-Dtornado.device.memory=1MB" uk.ac.manchester.tornado.unittests.fails.HeapFail#test03 || rc=1
          test-native.sh || rc=1
          exit $rc

      - name: Install the SDK's TornadoVM jars into the local Maven repo
        run: |
          # The sample apps take their TornadoVM coordinate from a tornadovm.version property.
          # Build them against the API this SDK ships, not the released one: kernel entries are
          # resolved through the compiler-generated writeReplace()/SerializedLambda, which javac
          # only emits when TornadoFunctions.TaskN was Serializable at the application's COMPILE
          # time, so a jar built against an older API fails at run time whatever it runs on.
          #
          # This job only unpacks the SDK tarball - it never runs `mvn install` - so the
          # tornado-* coordinates must be seeded here rather than relied on from whatever the
          # build job happened to leave in a shared ~/.m2 (which silently served a stale,
          # wrong-profile jar until the version string gained its -jdkNN suffix).
          TDIR="$TORNADOVM_HOME/share/java/tornado"
          VERSION=$(ls "$TDIR" | sed -n 's/^tornado-api-\(.*\)\.jar$/\1/p' | head -1)
          [ -n "$VERSION" ] || { echo "::error::could not resolve the SDK's tornado-api version"; exit 1; }
          echo "Building the sample apps against tornado-api $VERSION"
          echo "TORNADO_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Run install-file from a neutral cwd: inside the checkout the root pom's
          # <classifier>${platform}</classifier> leaks in and the jars land under a
          # mac-aarch64/linux-amd64 classifier instead of the bare coordinate.
          cd "${RUNNER_TEMP:-/tmp}"
          for jar in "$TDIR"/tornado-*-"$VERSION".jar; do
            art=$(basename "$jar" ".jar"); art=${art%-"$VERSION"}
            mvn -q org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file \
              -Dfile="$jar" -DgroupId=io.github.beehive-lab -DartifactId="$art" \
              -Dversion="$VERSION" -Dpackaging=jar
            echo "  installed io.github.beehive-lab:$art:$VERSION"
          done

      # On every leg: there is one leg per (platform, backend, SDK), so each SDK artifact gets
      # downstream integration coverage.
      - name: Build & run TornadoVM-Ray-Tracer (regression)
        timeout-minutes: 15
        run: |
          source $VENV_PATH/bin/activate
          rm -rf TornadoVM-Ray-Tracer
          git clone --depth 1 --branch master https://github.com/beehive-lab/TornadoVM-Ray-Tracer.git
          cd TornadoVM-Ray-Tracer
          export TORNADO_RAY_TRACER_ROOT="$PWD"
          mvn clean install -Dtornadovm.version="$TORNADO_VERSION"
          ./bin/tornadovm-ray-tracer regression

      - name: Build & run KFusion-TornadoVM
        timeout-minutes: 15
        run: |
          source $VENV_PATH/bin/activate
          rm -rf kfusion-tornadovm
          git clone --depth 1 --branch master https://github.com/beehive-lab/kfusion-tornadovm.git
          cd kfusion-tornadovm
          export KFUSION_ROOT="${PWD}"
          export PATH="${PATH}:${KFUSION_ROOT}/bin"
          mvn clean install -Dtornadovm.version="$TORNADO_VERSION"
          ./scripts/run.sh
