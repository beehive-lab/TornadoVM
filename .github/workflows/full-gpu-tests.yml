name: "Manual: full GPU tests on every device [CUDA, OpenCL]"

# Manual only. The scheduled full run on every device is gpu-ci.yml's nightly run; this stays for
# a combined cuda,opencl build of a chosen branch on demand.
on:
  workflow_dispatch:

jobs:
  build-full-test-openjdk:
    if: github.repository == 'beehive-lab/TornadoVM'
    runs-on: [ self-hosted, Linux, x64 ]
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 1
    env:
      JAVA_HOME: /opt/jenkins/jdks/graal-23.1.0/jdk-21.0.3
      MAVEN_HOME: /opt/maven
      CMAKE_ROOT: /opt/jenkins/cmake-3.25.2-linux-x86_64
      TORNADO_ROOT: ${{ github.workspace }}
      TORNADOVM_HOME: ${{ github.workspace }}/bin/sdk
      VENV_PATH: ${{ github.workspace }}/venv-opencl

    steps:
      - name: Checkout TornadoVM
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "$MAVEN_HOME/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH
      - name: Setup Python venv
        run: |
          python3 -m venv $VENV_PATH
          source $VENV_PATH/bin/activate
          pip install --upgrade pip tqdm psutil   # Combined
      - name: Build TornadoVM (jdk21)
        run: |
          java -version
          make jdk21 BACKEND=cuda,opencl
      - name: Run full unit tests
        working-directory: ${{ env.TORNADO_ROOT }}
        run: |
          source $VENV_PATH/bin/activate
          source setvars.sh
          make tests
      - name: Run full unit tests for OpenCL on NVIDIA GPU
        run: |
          source $VENV_PATH/bin/activate
          source setvars.sh
          tornado-test --verbose --jvm="-Dtornado.unittests.device=0:0"
      - name: Run full unit tests for CUDA on NVIDIA GPU
        run: |
          source $VENV_PATH/bin/activate
          source setvars.sh
          tornado-test --verbose --jvm="-Dtornado.unittests.device=1:0"
