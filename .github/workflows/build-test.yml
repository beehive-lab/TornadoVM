    steps:
      - uses: actions/checkout@v4

      - name: Resolve JDK environment
        run: |
          case "${{ matrix.jdk }}" in
            jdk21)
              echo "JAVA_HOME=/opt/jenkins/jdks/graalvm-community-openjdk-21.0.1+12.1/Contents/Home" >> "$GITHUB_ENV"
              echo "GRAAL_JARS=/opt/graalJars" >> "$GITHUB_ENV"
              ;;
            jdk25)
              echo "JAVA_HOME=/opt/jenkins/jdks/jdk-25.0.2.jdk/Contents/Home" >> "$GITHUB_ENV"
              echo "GRAAL_JARS=/opt/graal25Jars" >> "$GITHUB_ENV"
              ;;
            jdk26)
              # TODO: placeholder — provision a real JDK 26 install + GraalVM-jars cache
              # on the self-hosted macOS runner(s) and update this path.
              echo "JAVA_HOME=/opt/jenkins/jdks/jdk-26.x.x.jdk/Contents/Home" >> "$GITHUB_ENV"
              echo "GRAAL_JARS=/opt/graal26Jars" >> "$GITHUB_ENV"
              ;;
            jdk27)
