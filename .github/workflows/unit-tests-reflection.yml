name: No-GPU Unit Tests — reflection + CUDA codegen [JDK 21-27, GraalVM]

# Pure-JVM unit tests for the reflection metadata layer (tornado-runtime/src/test). These need no GPU,
# so they run on standard GitHub-hosted runners - the first no-GPU CI stage for TornadoVM. The full
# build is still required first so the modular dependencies (tornado-api, tornado.graal, ...) are on
# the module path for the reflection tests; the tests themselves touch no device.
#
# These are surefire tests, compiled and run by Maven rather than launched from a packaged SDK, so
# unlike build-test.yml this workflow cannot reuse one artifact across JDKs. What it does instead is
# the complementary half of the same claim: build-test.yml proves one ARTIFACT runs on every JDK,
# and this proves the jdk22plus profile BUILDS on every JDK. The matrix axis is therefore the host
# JDK, not the profile -- there is only one profile.
#
# A GraalVM leg rides along: a GraalVM JDK bundles its own Graal, JVMCI and org.graalvm.* modules,
# and the SDK has to build and resolve its module graph next to them without a clash. Every leg
# checks that by booting the SDK's module layer (java --dry-run) on its host JDK.
#
# The reflection layer sits on tornado-meta on every host, but each host JDK has its own
# reflection, class-file and Unsafe behaviour, so a regression specific to one JDK would stay green forever if only one JDK ran.
#
# The CUDA code-generator tests (tornado-drivers/cuda/src/test) ride along here rather than in
# their own workflow. They build LIR by hand and run the code-generator passes over it, so they
# touch no device and no CUDA driver, and they need exactly what this job has already built: the
# graalJars staged and tornado.graal installed locally. Giving them a separate workflow would
# duplicate this whole build matrix to run tests that finish in under a second. Building against
# the OpenCL backend is fine for them -- tornado-drivers/cuda/src/main is pure Java, so the module
# compiles and tests without a CUDA toolkit.
#
# They belong in CI rather than in the GPU suite because a code-generator reordering bug does not
# fail loudly: it produces a kernel that still compiles, still launches, and returns a slightly
# wrong number. These assert the emitted schedule directly, including several thousand randomly
# generated instruction sequences.

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# As in build-test.yml: one live run per branch, and a superseded pull request run is cancelled.
# These are GitHub-hosted rather than self-hosted, so the cost is not a blocked queue, but seven
# ubuntu-latest jobs per push adds up and the result of a run against an overwritten commit is
# read by nobody.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reflection-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The preview-compiled jdk21 SDK on JDK 21, then the jdk22plus profile on every JDK from 22.
          - profile: jdk21
            distribution: temurin
            setup_java_version: '21'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '22'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '23'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '24'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '25'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '26'
          - profile: jdk22plus
            distribution: temurin
            setup_java_version: '27-ea'
          - profile: jdk22plus
            distribution: graalvm
            setup_java_version: '25'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.setup_java_version }}

      - name: Report the host JDK under test
        run: java -version

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ocl-icd-opencl-dev opencl-headers python3-venv

      - name: Build TornadoVM (opencl, ${{ matrix.profile }})
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip tqdm psutil
          make ${{ matrix.profile }} BACKEND=opencl

      - name: Show the SDK's declared JDK contract
        run: cat "$(ls -d dist/*/*/)etc/tornado.jdk"

      - name: Boot the SDK's module layer on this JDK
        run: |
          # Resolves every TornadoVM module, tornado.graal and tornado.meta against this JDK's own
          # modules and loads the test runner's main class, without running it. A module or
          # package clash with the JDK (e.g. a GraalVM JDK's bundled Graal) fails here.
          SDK="$(ls -d $PWD/dist/*/*/)"; SDK="${SDK%/}"
          java @"$SDK/tornado-argfile" --add-modules tornado.unittests --dry-run \
            -m tornado.unittests/uk.ac.manchester.tornado.unittests.tools.TornadoTestRunner

      - name: Run reflection unit tests (${{ matrix.profile }})
        run: make test-reflection

      - name: Run CUDA code generator unit tests (${{ matrix.profile }})
        run: make test-cuda-codegen

  # A GraalVM native image of a TornadoVM application, built with bin/tornado-native-image and run on
  # the runner's CPU through PoCL (a CPU OpenCL implementation), so the whole path -- tracing, the image
  # build, and JIT-compiling and running a kernel inside the image -- is exercised without a GPU.
  native-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'

      - name: Install native build dependencies and PoCL
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ocl-icd-opencl-dev opencl-headers python3-venv pocl-opencl-icd clinfo
          clinfo -l

      - name: Build TornadoVM (opencl)
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip tqdm psutil
          make jdk22plus BACKEND=opencl

      - name: Build and run a native image of VectorAddInt
        run: |
          SDK="$(ls -d $PWD/dist/*/*/)"; export TORNADOVM_HOME="${SDK%/}"
          export PATH="$TORNADOVM_HOME/bin:$PATH"
          tornado --devices
          tornado-native-image -m tornado.examples/uk.ac.manchester.tornado.examples.VectorAddInt \
            -o vectoradd --trace "-- 4096"
          ls -l vectoradd
          ./vectoradd 4096 | tee run.log
          grep -q "Result is correct" run.log
          ! grep -q "Result is wrong" run.log
