name: 4 - Deploy Maven Central [auto]

# Dispatched explicitly by build-release-sdks.yml's mark-version-built job
# once step 3 finishes successfully (real or draft_release_test alike) —
# not via workflow_run/push-tag. workflow_run on finalize completion never
# actually fired in this repo's history (confirmed empirically), and even if
# it had, it would fire far too early (right after finalize, before the SDKs
# are even built). Explicit dispatch also lets draft_release_test be passed
# straight through instead of having to guess it from the triggering run.
#
# The deployed modules are portable pure-Java: tornado-api (including the
# cuTile TileContext API), tornado-runtime, tornado-matrices, the CUDA backend
# tornado-drivers-cuda (which compiles cuTile kernels) with its parent and
# tornado-drivers-common, and the CUDA library bindings tornado-cublas/-cudnn/
# -cufft/-curand/-cusparse/-cudf/-cutlass/-cuvs. The bindings load the NVIDIA libraries
# through java.lang.foreign at run time; the native *-jni shims some of them use
# are built per platform and ship only in the SDK. Each module is deployed under
# the X.Y.Z-jdk22plus Maven Central coordinate — jdk22plus is the only Maven
# profile left (see bin/compile) and covers every JDK from 22 up — matching the
# existing "pin a specific JDK line" convention — see the `jdk` matrix below.
# The leg does an ephemeral `versions:set` (never committed)
# right before `mvn deploy`, since the single release tag's committed pom.xml
# version carries no JDK suffix at all.
#
# Once every matrix leg succeeds, this dispatches publish-archives-to-sdkman.yml
# once (with publish=false during a draft_release_test so that workflow still
# runs for real up to the point of actually publishing).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v2.1.0)'
        required: false
        type: string
      draft_release_test:
        description: 'Draft release (test): skip the actual `mvn deploy` push, and pass publish=false down to SDKMAN.'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    if: github.repository == 'beehive-lab/TornadoVM'
    name: Deploy to Maven Central (${{ matrix.jdk }})
    runs-on: [self-hosted, Linux, x64]
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        jdk: [jdk22plus]
    env:
      MAVEN_HOME: /opt/maven
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # draft_release_test never actually creates inputs.tag as a real
          # git ref (finalize's tag creation is itself skipped in draft
          # mode), so checking it out would fail — use master instead, which
          # is what the draft finalize run actually operated on.
          ref: ${{ (inputs.draft_release_test == true && 'master') || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve JDK environment
        run: |
          case "${{ matrix.jdk }}" in
            jdk22plus)
              # jdk22plus floors at JDK 22 and is deployed once for every JDK from 22 up — any
              # JDK >= 22 here builds an identical artifact (pom.xml's --release 22), so this is
              # pinned to 25 purely to match the build JDK used elsewhere (build-release-sdks.yml,
              # build-test-platform.yml), not a requirement.
              echo "JAVA_HOME=/opt/jenkins/jdks/jdk-25.0.2" >> "$GITHUB_ENV"
              echo "GRAAL_JARS=/opt/graalJarsNoJvmci" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Setup environment
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "$MAVEN_HOME/bin" >> $GITHUB_PATH

      - name: Stage and build the vendored Graal module for this profile
        run: |
          mkdir -p graalJars && cp $GRAAL_JARS/* graalJars/
          # The staged jar on this shared self-hosted runner can be left over from another
          # build, and a module-info newer than the build JDK fails with "Unsupported
          # major.minor version" -> the reactor then reports "module not found: tornado.graal".
          # Drop the staged jar and let pull_graal_jars rebuild + reinstall it (it already
          # validates the descriptor is readable by the build JDK and rebuilds if not).
          rm -f graalJars/tornado-graal-*.jar
          python3 bin/pull_graal_jars.py --jdk ${{ matrix.jdk }}

      - name: Set JDK-specific deploy version (ephemeral, never committed)
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # In draft_release_test mode inputs.tag is often empty (nothing was
          # ever tagged) — fall back to whatever version is already committed
          # on master plus the JDK suffix, just for a real, well-formed
          # coordinate to exercise the deploy machinery against.
          if [ -n "$TAG" ]; then
            BASE_VERSION="${TAG#v}"
          else
            BASE_VERSION=$(./mvnw -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          fi
          DEPLOY_VERSION="${BASE_VERSION}-${{ matrix.jdk }}"
          echo "Setting Maven version to ${DEPLOY_VERSION} for this deploy only (not committed/pushed)."
          ./mvnw versions:set -DnewVersion="${DEPLOY_VERSION}" -DgenerateBackupPoms=false

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>gpg</id>
                <properties>
                  <gpg.executable>gpg</gpg.executable>
                  <gpg.keyname>${env.GPG_KEYNAME}</gpg.keyname>
                  <gpg.passphrase>${env.GPG_PASSPHRASE}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>gpg</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_TTY: $(tty)

      - name: Deploy to Maven Central
        if: ${{ inputs.draft_release_test != true }}
        run: |
          # cuda-backend only puts tornado-drivers/cuda in the reactor; -pl keeps the native
          # *-jni shims (CMake, need the CUDA toolkit) out, and they stay in the SDK.
          mvn clean deploy \
            -P${{ matrix.jdk }},cuda-backend,release \
            -pl tornado-api,tornado-runtime,tornado-matrices,tornado-drivers/cuda,tornado-cublas,tornado-cudnn,tornado-cufft,tornado-curand,tornado-cusparse,tornado-cudf,tornado-cutlass,tornado-cuvs \
            -am \
            -DskipTests \
            --batch-mode
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Draft release (test) - Maven Central
        if: ${{ inputs.draft_release_test == true }}
        run: |
          echo "Draft release (test): skipping the actual Maven Central deploy (mvn clean deploy -P${{ matrix.jdk }},release ...)."
          echo "Everything up to this point (checkout, GraalVM jars, ephemeral versions:set, Maven settings, GPG import) ran for real."

  dispatch-sdkman:
    name: Dispatch SDKMAN publish
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: [self-hosted, Linux, x64]
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Dispatch publish-archives-to-sdkman.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ "${{ inputs.draft_release_test }}" = "true" ]; then
            PUBLISH="false"
          else
            PUBLISH="true"
          fi
          echo "Both JDK Maven Central deploys succeeded. Dispatching publish-archives-to-sdkman.yml for $TAG (publish=$PUBLISH, draft_release_test=${{ inputs.draft_release_test }})..."
          gh workflow run publish-archives-to-sdkman.yml \
            --repo "${{ github.repository }}" \
            -f tag="$TAG" \
            -f publish="$PUBLISH" \
            -f draft_release_test="${{ inputs.draft_release_test }}"
